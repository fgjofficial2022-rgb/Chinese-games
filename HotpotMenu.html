<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一起去吃火锅吧！· 互动点餐菜单</title>
<style>
  :root{
    --ivory:#f8f4ec;
    --paper:#fffdfa;
    --ink:#2e241f;
    --ink-soft:#6d5c52;
    --ink-mute:#9c8b7d;
    --gold:#b99358;
    --gold-l:#d8c19a;
    --gold-pale:#efe4d0;
    --crimson:#8c1f2b;
    --crimson-d:#70141f;
    --line:#e9ddc9;
    --line-soft:#f0e7d8;
    --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--ivory);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(185,147,88,.09), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(140,31,43,.06), transparent 42%);
  }
  #app{position:relative;z-index:1;}
  button{font-family:inherit;}

  .wrap{max-width:1020px;margin:0 auto;padding:30px 22px 88px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font-size:.94rem;letter-spacing:.06em;padding:11px 22px;border-radius:4px;
    cursor:pointer;border:1px solid transparent;background:none;
    transition:all .18s ease;white-space:nowrap;line-height:1.4;
  }
  .btn-primary{
    background:linear-gradient(180deg,#9a2430,#79141f);
    color:#f8eeda;border-color:#6f1220;
    box-shadow:0 8px 20px rgba(121,20,31,.22);
  }
  .btn-primary:hover{background:linear-gradient(180deg,#a92a37,#8a1a27);box-shadow:0 12px 26px rgba(121,20,31,.28);transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
  .btn-ghost:hover{border-color:var(--gold-l);color:var(--crimson);background:#fffdf8;}
  .btn-lg{font-size:1rem;padding:14px 40px;letter-spacing:.2em;text-indent:.2em;}

  .cover{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:44px 20px;
  }
  .cover-card{
    position:relative;width:100%;max-width:660px;
    background:var(--paper);
    border:1px solid var(--line);
    padding:52px 40px 46px;
    text-align:center;
    box-shadow:0 24px 60px rgba(120,92,54,.10);
  }
  .cover-card::before{
    content:"";position:absolute;inset:10px;border:1px solid var(--gold-pale);pointer-events:none;
  }
  .cover-card::after{
    content:"";position:absolute;left:50%;top:0;width:1px;height:18px;
    background:linear-gradient(180deg,transparent,var(--gold-l));
  }
  .cover-art{display:flex;justify-content:center;margin-bottom:6px;}
  .cover-art svg{width:min(62vw,250px);height:auto;}
  .eyebrow{
    font-size:.64rem;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;
    color:var(--gold);margin:8px 0 16px;
  }
  .cover-title{
    font-family:var(--serif);
    font-size:clamp(1.72rem,6.2vw,2.5rem);
    letter-spacing:.14em;text-indent:.14em;
    color:var(--crimson-d);margin:0 0 12px;font-weight:600;
  }
  .cover-en{
    font-size:.74rem;letter-spacing:.36em;text-indent:.36em;text-transform:uppercase;
    color:#b08a4a;margin:0 0 22px;
  }
  .rule{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px;}
  .rule::before,.rule::after{
    content:"";width:64px;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold-l),transparent);
  }
  .rule span{color:var(--gold);font-size:.58rem;}
  .cover-desc{
    color:var(--ink-mute);font-size:.92rem;line-height:2.1;margin:0 0 34px;letter-spacing:.04em;
  }

  .progress{display:flex;gap:5px;margin-bottom:20px;}
  .progress i{flex:1;height:2px;background:var(--line);border-radius:1px;transition:.25s;}
  .progress i.done{background:var(--gold-l);}
  .progress i.active{background:var(--crimson);}

  .page-head{margin-bottom:26px;}
  .step-label{
    font-size:.68rem;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;
    color:var(--gold);margin:0 0 12px;
  }
  .page-title{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(1.3rem,4.3vw,1.74rem);
    color:var(--crimson-d);margin:0 0 8px;letter-spacing:.08em;
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  }
  .title-en{
    font-family:var(--sans);font-size:.68rem;letter-spacing:.28em;text-indent:.28em;
    text-transform:uppercase;color:var(--gold);font-weight:400;
  }
  .page-sub{color:var(--ink-mute);font-size:.85rem;margin:0;letter-spacing:.04em;line-height:1.7;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;margin-bottom:20px;
    padding-bottom:14px;border-bottom:1px solid var(--line-soft);
  }
  .chip{
    display:inline-flex;align-items:center;gap:8px;
    font-size:.8rem;letter-spacing:.1em;color:var(--crimson);
    border:1px solid var(--gold-pale);background:#fffaf1;
    padding:5px 14px;border-radius:2px;
  }
  .link{
    background:none;border:none;color:var(--ink-mute);font-size:.8rem;cursor:pointer;
    letter-spacing:.06em;padding:4px 2px;border-bottom:1px solid transparent;transition:.16s;
  }
  .link:hover{color:var(--crimson);border-bottom-color:var(--gold-l);}

  .types{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));
    gap:18px;
  }
  .type-card{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    background:var(--paper);border:1px solid var(--line);border-radius:6px;
    padding:26px 18px 24px;cursor:pointer;color:inherit;text-align:center;
    transition:all .2s ease;
  }
  .type-card:hover{border-color:var(--gold-l);box-shadow:0 14px 32px rgba(120,92,54,.10);transform:translateY(-2px);}
  .type-card.selected{
    border-color:var(--crimson);background:#fffaf3;
    box-shadow:0 0 0 1px var(--crimson), 0 14px 32px rgba(140,31,43,.10);
  }
  .type-art{display:flex;align-items:center;justify-content:center;height:78px;margin-bottom:12px;}
  .type-art svg{width:88px;height:auto;display:block;}
  .type-name{
    font-family:var(--serif);font-size:1.14rem;font-weight:600;
    color:var(--crimson-d);letter-spacing:.08em;
  }
  .type-en{
    font-size:.6rem;letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;
    color:var(--gold);margin-bottom:8px;
  }
  .type-tag{font-size:.79rem;color:var(--ink-mute);letter-spacing:.06em;}

  .opts{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
    gap:12px;align-items:start;
  }
  .opts-sm{grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px;}

  .opt{
    position:relative;display:flex;flex-direction:column;gap:3px;align-items:stretch;
    background:var(--paper);border:1px solid var(--line);border-radius:6px;
    padding:15px 40px 15px 16px;cursor:pointer;text-align:left;
    transition:all .16s ease;user-select:none;outline:none;
  }
  .opt:focus-visible{border-color:var(--gold);box-shadow:0 0 0 2px rgba(185,147,88,.25);}
  .opt:hover{border-color:var(--gold-l);background:#fffcf6;}
  .opt.selected{
    border-color:var(--crimson);background:#fff8f1;
    box-shadow:inset 0 0 0 1px var(--crimson);
  }
  .opt-n{
    display:flex;flex-wrap:wrap;align-items:baseline;
    column-gap:6px;row-gap:0;
    font-size:.95rem;line-height:1.5;letter-spacing:.03em;color:var(--ink);
    transition:color .16s;padding-right:4px;
  }
  .opt.selected .opt-n{color:var(--crimson-d);}
  .opt-en{
    font-size:.7rem;color:var(--gold);
    letter-spacing:.01em;font-weight:400;
    white-space:nowrap;
  }
  .opt-py{
    font-size:.7rem;color:var(--ink-mute);line-height:1.4;
    letter-spacing:.04em;font-style:italic;
  }
  .opt-h{
    font-size:.71rem;line-height:1.6;letter-spacing:.01em;color:var(--ink-mute);
    word-break:break-word;
  }
  .opt-mark{
    position:absolute;top:13px;right:13px;
    width:15px;height:15px;border-radius:50%;
    border:1px solid #ded1bb;background:#fff;
    display:grid;place-items:center;
    font-size:.52rem;color:#fff;line-height:1;
    opacity:0;transform:scale(.7);transition:all .18s ease;
  }
  .opt.selected .opt-mark{
    opacity:1;transform:scale(1);
    background:var(--crimson);border-color:var(--crimson);
  }

  .qty-ctl{
    display:flex;align-items:center;gap:6px;
    margin-top:9px;padding-top:8px;
    border-top:1px dashed #eadcc6;
  }
  .qty-btn{
    width:24px;height:24px;flex:0 0 24px;border-radius:50%;
    border:1px solid var(--gold-l);background:#fff;color:var(--ink-soft);
    display:grid;place-items:center;
    font-size:.92rem;line-height:1;font-weight:600;
    cursor:pointer;padding:0;transition:all .14s ease;
  }
  .qty-btn:hover{border-color:var(--crimson);color:var(--crimson);background:#fffdf8;}
  .qty-btn:active{transform:scale(.92);}
  .qty-num{
    min-width:26px;text-align:center;
    font-size:.86rem;font-weight:600;color:var(--crimson-d);
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }
  .qty-num.zero{color:#c8bbab;font-weight:400;}
  .qty-unit{font-size:.7rem;color:var(--ink-mute);letter-spacing:.04em;}

  .opts-sm .opt{padding:12px 34px 12px 13px;}
  .opts-sm .opt-h{font-size:.68rem;}
  .opts-sm .opt-n{font-size:.92rem;}
  .opts-sm .opt-en,
  .opts-sm .opt-py{font-size:.66rem;}

  @media (max-width:640px){
    .opt-en{white-space:normal;word-break:normal;}
  }

  .sub-panel{
    margin-top:26px;padding:20px 22px 20px;
    background:#fffbf3;border:1px solid var(--gold-pale);border-radius:6px;
  }
  .sub-title{
    display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
    font-family:var(--serif);font-size:.98rem;font-weight:600;
    color:var(--crimson-d);margin:0 0 14px;letter-spacing:.1em;
  }
  .sub-title .en{
    font-family:var(--sans);font-size:.58rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--gold);font-weight:400;
  }
  .sub-badge{
    margin-left:auto;font-size:.6rem;letter-spacing:.16em;color:var(--crimson);
    border:1px solid var(--gold-l);padding:2px 9px;border-radius:2px;
  }

  .pot-configs{margin-top:14px;}
  .pot-row{
    display:flex;flex-wrap:wrap;gap:12px;padding:13px 15px;
    border:1px dashed #e3cfa6;border-radius:6px;background:#fffcf6;
    margin-bottom:10px;
  }
  .pot-row:last-child{margin-bottom:0;}
  .pot-label{
    flex:0 0 100%;font-weight:600;color:var(--crimson-d);
    font-size:.85rem;letter-spacing:.08em;margin-bottom:2px;
  }
  .pot-group{flex:1 1 210px;min-width:0;}
  .pot-sub{
    font-size:.7rem;color:var(--ink-mute);letter-spacing:.08em;
    margin-bottom:7px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip-btn{
    padding:5px 12px;border:1px solid var(--line);border-radius:4px;
    background:#fff;font-size:.8rem;cursor:pointer;transition:.15s ease;
    color:var(--ink-soft);letter-spacing:.02em;
  }
  .chip-btn:hover{border-color:var(--gold-l);color:var(--crimson);}
  .chip-btn.on{
    border-color:var(--crimson);background:#fff4ec;
    color:var(--crimson-d);font-weight:600;
  }

  /* ============ 汽水 / 果汁面板 ============ */
  .soda-panel{
    margin-top:20px;padding:16px 18px;
    border:1px solid var(--gold-pale);border-radius:6px;background:#fffbf3;
  }
  .soda-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));
    gap:10px;
  }
  .soda-card{
    border:1px solid var(--line);border-radius:6px;padding:12px 13px;
    background:#fff;transition:all .15s ease;
  }
  .soda-card.on{border-color:var(--crimson);background:#fff8f1;}
  .soda-head{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:8px;flex-wrap:wrap;margin-bottom:8px;
  }
  .soda-name{font-size:.92rem;color:var(--ink);letter-spacing:.03em;}
  .soda-card.on .soda-name{color:var(--crimson-d);}
  .soda-en{font-size:.66rem;color:var(--gold);}

  .soda-size-row{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:7px 0;
    border-top:1px dashed #efe4d0;
  }
  .soda-size-row:first-of-type{border-top:none;padding-top:2px;}
  .size-name{
    font-size:.8rem;letter-spacing:.06em;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .soda-card.on .size-name{color:var(--crimson-d);}
  .soda-size-row .qty-ctl{
    margin-top:0;padding-top:0;border-top:none;
  }
  .soda-size-row .qty-btn{width:22px;height:22px;flex:0 0 22px;font-size:.86rem;}
  .soda-size-row .qty-num{min-width:22px;font-size:.82rem;}

  .notice{
    display:flex;gap:10px;align-items:flex-start;
    background:#fff7e8;border:1px solid #e8cfa2;color:#8a5a1f;
    padding:13px 17px;border-radius:4px;
    font-size:.85rem;line-height:1.75;letter-spacing:.03em;
    margin-bottom:20px;
  }
  .notice .dot-mark{
    flex:0 0 auto;width:6px;height:6px;border-radius:50%;
    background:#c9913f;margin-top:8px;
  }
  .notice ul{margin:0;padding-left:2px;list-style:none;}
  .notice li + li{margin-top:2px;}
  .notice.shake{animation:shake .42s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-5px);}
    40%{transform:translateX(4px);}
    60%{transform:translateX(-3px);}
    80%{transform:translateX(2px);}
  }

  .nav{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;
    margin-top:40px;padding-top:24px;border-top:1px solid var(--line-soft);
  }
  .nav-left{display:flex;gap:10px;flex-wrap:wrap;}

  .panel{
    background:var(--paper);border:1px solid var(--line);border-radius:6px;
    padding:6px 24px;
  }
  .row{display:flex;gap:20px;padding:18px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start;}
  .row:last-child{border-bottom:none;}
  .row-title{
    flex:0 0 156px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:.92rem;color:var(--crimson-d);letter-spacing:.06em;line-height:1.6;
  }
  .row-title .no{font-family:var(--serif);font-size:.72rem;color:var(--gold);}
  .row-title .en{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);}
  .row-body{flex:1;display:flex;flex-wrap:wrap;gap:7px;padding-top:1px;}
  .tag{
    font-size:.84rem;line-height:1.6;letter-spacing:.02em;
    color:#5d483c;background:#fffaf1;border:1px solid var(--line);
    padding:3px 11px;border-radius:2px;
  }
  .empty{color:#bdb0a2;font-size:.84rem;letter-spacing:.06em;}

  .menu-card{
    position:relative;background:var(--paper);
    border:1px solid var(--line);
    padding:46px 44px 40px;
    box-shadow:0 24px 60px rgba(120,92,54,.10);
  }
  .menu-card::before{
    content:"";position:absolute;inset:10px;border:1px solid var(--gold-pale);pointer-events:none;
  }
  .menu-head{text-align:center;}
  .menu-art{display:flex;justify-content:center;margin-bottom:10px;}
  .menu-art svg{width:80px;height:auto;}
  .menu-kicker{
    font-size:.6rem;letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;
    color:var(--gold);margin:6px 0 14px;
  }
  .menu-title{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(1.42rem,4.6vw,1.98rem);
    color:var(--crimson-d);letter-spacing:.16em;text-indent:.16em;margin:0 0 10px;
  }
  .menu-sub{font-size:.82rem;color:var(--ink-mute);letter-spacing:.1em;margin:0;}
  .menu-body{margin-top:8px;}
  .m-sec{border-top:1px solid var(--line-soft);padding-top:16px;margin-top:16px;}
  .m-sec h3{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    font-family:var(--serif);font-size:.98rem;font-weight:600;
    color:var(--crimson-d);letter-spacing:.1em;margin:0 0 9px;
  }
  .m-sec h3 .no{font-family:var(--serif);font-size:.7rem;color:var(--gold);}
  .m-sec h3 .en{
    font-family:var(--sans);font-size:.58rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--gold);font-weight:400;
  }
  .m-items{font-size:.95rem;color:#4b382e;line-height:1.95;letter-spacing:.03em;}
  .m-items .sep{color:var(--gold-l);margin:0 8px;}
  .menu-foot{
    margin:34px 0 0;padding-top:22px;border-top:1px solid var(--line-soft);
    text-align:center;font-family:var(--serif);
    color:var(--crimson-d);letter-spacing:.2em;text-indent:.2em;font-size:1.02rem;
  }

  .music-btn{
    position:fixed;right:20px;bottom:20px;z-index:120;
    width:44px;height:44px;border-radius:50%;
    border:1px solid var(--gold-l);background:var(--paper);
    display:grid;place-items:center;cursor:pointer;
    box-shadow:0 8px 22px rgba(120,92,54,.16);
    font-size:1.05rem;color:var(--crimson);
    transition:all .18s ease;
  }
  .music-btn:hover{border-color:var(--crimson);transform:translateY(-2px);}
  .music-btn.off{color:var(--ink-mute);opacity:.65;}

  .toast{
    position:fixed;left:50%;bottom:78px;transform:translate(-50%,14px);
    background:rgba(46,36,31,.95);color:#f8eeda;
    padding:11px 24px;border-radius:3px;font-size:.86rem;letter-spacing:.06em;
    opacity:0;pointer-events:none;transition:all .26s ease;z-index:99;
    box-shadow:0 12px 30px rgba(0,0,0,.22);
    max-width:calc(100vw - 40px);text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (max-width:640px){
    .wrap{padding:22px 16px 74px;}
    .cover{padding:26px 14px;}
    .cover-card{padding:38px 22px 34px;}
    .cover-card::before{inset:8px;}
    .opts{grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px;}
    .opts-sm{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));}
    .opt{padding:14px 36px 14px 14px;}
    .opt-n{font-size:.92rem;}
    .opt-en,.opt-py{font-size:.66rem;}
    .row{flex-direction:column;gap:8px;}
    .row-title{flex:none;}
    .menu-card{padding:34px 20px 30px;}
    .menu-card::before{inset:7px;}
    .nav-left{width:100%;}
    .nav-left .btn{flex:1;}
    .nav > .btn-primary{width:100%;}
    .sub-panel{padding:16px 15px;}
    .soda-panel{padding:14px 13px;}
    .pot-row{padding:12px 12px;}
  }

  @page{margin:14mm;}
  @media print{
    body{background:#fff;}
    body::before{display:none;}
    .no-print{display:none !important;}
    .music-btn{display:none !important;}
    .wrap{max-width:100%;padding:0;}
    .menu-card{box-shadow:none;border:1px solid #d9cfbe;padding:8mm;}
    .menu-card::before{display:none;}
    .m-sec{break-inside:avoid;page-break-inside:avoid;}
    .menu-title{color:#000;}
  }
</style>
</head>
<body>
<div id="app"></div>
<button type="button" class="music-btn" id="musicBtn" aria-label="背景音乐开关" title="背景音乐">🎵</button>

<script>
/* =====================================================================
   1. 内联 SVG 插画
   ===================================================================== */
const ART = {
  cover: `<svg viewBox="0 0 340 290" fill="none" aria-hidden="true">
    <circle cx="170" cy="150" r="120" stroke="#e8dcc4" stroke-width="1"/>
    <circle cx="170" cy="150" r="112" stroke="#f0e6d4" stroke-width="1" stroke-dasharray="1 8" stroke-linecap="round"/>
    <g stroke="#c8a465" stroke-width="1.4" stroke-linecap="round" opacity=".85">

   ===================================================================== */
const esc = s => String(s).replace(/[&<>"']/g, c => (
  { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
));
const br = s => esc(s).replace(/\n/g, '<br>');

function withQty(name){
  const q = state.qty[name] || 1;
  return `${name} x${q}`;
}

function optContent(o){
  return `<span class="opt-n">${esc(o.n)}${o.en ? `<span class="opt-en">${esc(o.en)}</span>` : ''}</span>`
       + (o.py ? `<span class="opt-py">${esc(o.py)}</span>` : '')
       + (o.h ? `<span class="opt-h">${br(o.h)}</span>` : '');
}

function catOptions(key){
  const b = DATA[state.type];
  return key === 'base' ? b.base.options : b[key];
}

function baseDef(name){
  return DATA[state.type].base.options.find(o => o.n === name) || null;
}

function isPot(def){
  return !!(def && (def.spicy || def.clearSide));
}

function makeConfig(def){
  return {
    clear: def.clearSide ? null : (def.fixedClear || null),
    spicy: def.spicy ? null : (def.fixedSpicy || null)
  };
}

function syncPotConfigs(name){
  const def = baseDef(name);
  if (!isPot(def)) return;
  if (!state.potConfigs[name]) state.potConfigs[name] = [];
  const arr = state.potConfigs[name];
  const qty = state.qty[name] || 1;
  while (arr.length < qty) arr.push(makeConfig(def));
  while (arr.length > qty) arr.pop();
}

function resetAll(){
  state.type = null;
  state.baseSel = [];
  state.potConfigs = {};
  state.sodaItems = {};
  state.juiceItems = {};
  state.qty = {};
  MULTI_KEYS.forEach(k => { state[k] = []; });
  stepIndex = 0;
}

function progressHTML(stepNo){
  let h = '<div class="progress">';
  for (let i = 1; i <= 9; i++){
    h += `<i class="${i === stepNo ? 'active' : (i < stepNo ? 'done' : '')}"></i>`;
  }
  return h + '</div>';
}

function sodaHasAny(){
  return Object.keys(state.sodaItems).some(brand =>
    Object.values(state.sodaItems[brand]).some(q => q > 0)
  );
}

function juiceHasAny(){
  return Object.keys(state.juiceItems).some(name =>
    Object.values(state.juiceItems[name]).some(q => q > 0)
  );
}

function validateOrder(){
  const issues = [];
  if (state.baseSel.length === 0) issues.push('请至少选择一种锅底');

  state.baseSel.forEach(name => {
    const def = baseDef(name);
    if (!isPot(def)) return;
    const qty = state.qty[name] || 1;
    const arr = state.potConfigs[name] || [];
    if (arr.length !== qty){
      issues.push(`「${name}」的锅数配置不完整`);
      return;
    }
    arr.forEach((c, i) => {
      if (def.clearSide && !c.clear) issues.push(`「${name}」第 ${i+1} 锅请选择清汤`);
      if (def.spicy && !c.spicy) issues.push(`「${name}」第 ${i+1} 锅请选择辣汤`);
    });
  });

  if (state.drink.indexOf('汽水') !== -1 && !sodaHasAny()){
    issues.push('请至少选择一种汽水规格');
  }
  if (state.drink.indexOf('果汁') !== -1 && !juiceHasAny()){
    issues.push('请至少选择一种果汁规格');
  }
  return issues;
}

function menuSections(){
  const b = DATA[state.type];
  const baseItems = [];

  state.baseSel.forEach(name => {
    const def = baseDef(name);
    const q = state.qty[name] || 1;
    let line = withQty(name);
    if (isPot(def)){
      const arr = state.potConfigs[name] || [];
      const parts = arr.map((c, i) => {
        const seg = [];
        if (c.clear) seg.push(`清汤：${c.clear}`);
        if (c.spicy) seg.push(`辣汤：${c.spicy}`);
        return `第${i+1}锅 ${seg.join(' · ')}`;
      });
      if (parts.length) line += '（' + parts.join('；') + '）';
    }
    baseItems.push(line);
  });

  const drinks = [];
  state.drink.forEach(d => {
    if (d === '汽水'){
      Object.keys(state.sodaItems).forEach(brand => {
        const items = state.sodaItems[brand];
        SODA_SIZES.forEach(size => {
          const q = items[size] || 0;
          if (q > 0) drinks.push(`汽水（${brand} · ${size}）x${q}`);
        });
      });
    } else if (d === '果汁'){
      Object.keys(state.juiceItems).forEach(name => {
        const items = state.juiceItems[name];
        JUICE_SIZES.forEach(size => {
          const q = items[size] || 0;
          if (q > 0) drinks.push(`果汁（${name} · ${size}）x${q}`);
        });
      });
    } else {
      drinks.push(withQty(d));
    }
  });

  return [
    { zh:'火锅类型',   en:'',              items:[b.name] },
    { zh:'锅底及辣度', en:'Broth',         items:baseItems },
    { zh:'肉类',       en:'Meat',          items:state.meat.map(withQty) },
    { zh:'蔬菜',       en:'Vegetables',    items:state.veg.map(withQty) },
    { zh:'主食',       en:'Staple Food',   items:state.staple.map(withQty) },
    { zh:'蘸料',       en:'Dipping Sauce', items:state.sauce.map(withQty) },
    { zh:'甜点／甜品', en:'Dessert',       items:state.dessert.map(withQty) },
    { zh:'饮品／饮料', en:'Drinks',        items:drinks }
  ];
}

/* =====================================================================
   6. 渲染
   ===================================================================== */
function render(scrollTop = true){
  if (view === 'cover')      app.innerHTML = coverHTML();
  else if (view === 'type')  app.innerHTML = typeHTML();
  else if (view === 'step')  app.innerHTML = stepHTML();
  else if (view === 'check') app.innerHTML = checkHTML();
  else if (view === 'final') app.innerHTML = finalHTML();

  if (scrollTop) window.scrollTo({ top:0, behavior:'smooth' });
}

/* =====================================================================
   7. 交互
   ===================================================================== */
function pickType(key){
  if (state.type !== key){
    state.type = key;
    state.baseSel = [];
    state.potConfigs = {};
    state.sodaItems = {};
    state.juiceItems = {};
    state.qty = {};
    MULTI_KEYS.forEach(k => { state[k] = []; });
  }
  view = 'step';
  stepIndex = 0;
  render(true);
}

function pickOption(i){
  const cat = CATS[stepIndex];
  const o = catOptions(cat.key)[i];
  if (!o) return;

  if (cat.key === 'base'){
    const idx = state.baseSel.indexOf(o.n);
    if (idx >= 0){
      state.baseSel.splice(idx, 1);
      delete state.qty[o.n];
      delete state.potConfigs[o.n];
    } else {
      state.baseSel.push(o.n);
      state.qty[o.n] = 1;
      syncPotConfigs(o.n);
    }
  } else {
    const arr = state[cat.key];
    const idx = arr.indexOf(o.n);
    if (idx >= 0){
      arr.splice(idx, 1);
      delete state.qty[o.n];
      if (cat.key === 'drink' && o.n === '汽水') state.sodaItems = {};
      if (cat.key === 'drink' && o.n === '果汁') state.juiceItems = {};
    } else {
      arr.push(o.n);
      state.qty[o.n] = 1;
    }
  }
  render(false);
}

function changeQty(name, delta){
  const cur = state.qty[name] || 1;
  const next = Math.min(MAX_QTY, Math.max(1, cur + delta));
  if (next === cur){
    if (delta < 0) toast('最少 1 份，如需取消请点击菜品卡片');
    else toast('最多 ' + MAX_QTY + ' 份');
    return;
  }
  state.qty[name] = next;
  if (state.baseSel.indexOf(name) !== -1) syncPotConfigs(name);
  render(false);
}

/* 通用规格计数：汽水 / 果汁 */
function changeSpecQty(store, name, size, delta){
  if (!store[name]) store[name] = {};
  const items = store[name];
  const cur = items[size] || 0;
  const next = Math.min(MAX_QTY, Math.max(0, cur + delta));

  if (next === cur){
    if (delta < 0) toast('已经是 0 份了');
    else toast('最多 ' + MAX_QTY + ' 份');
    return;
  }

  if (next === 0) delete items[size];
  else items[size] = next;

  if (Object.keys(items).length === 0) delete store[name];

  render(false);
}

function handleNav(nav){
  if (nav === 'prev'){
    if (stepIndex > 0){ stepIndex--; render(true); }
    else { view = 'type'; render(true); }
  } else if (nav === 'next'){
    if (CATS[stepIndex].key === 'base' && !state.baseSel.length){
      toast('请先选择至少一种锅底');
      return;
    }
    if (stepIndex < CATS.length - 1){ stepIndex++; render(true); }
    else { view = 'check'; render(true); }
  } else if (nav === 'clear'){
    const key = CATS[stepIndex].key;
    if (key === 'base'){
      state.baseSel.forEach(n => { delete state.qty[n]; delete state.potConfigs[n]; });
      state.baseSel = [];
    } else {
      state[key].forEach(n => delete state.qty[n]);
      state[key] = [];
      if (key === 'drink'){ state.sodaItems = {}; state.juiceItems = {}; }
    }
    render(false);
  } else if (nav === 'type'){
    view = 'type';
    render(true);
  }
}

function handleAct(act){
  switch (act){
    case 'start':
      Music.start();
      updateMusicBtn();
      view = 'type'; render(true);
      break;
    case 'to-cover':      view = 'cover'; render(true); break;
    case 'back-to-steps': view = 'step'; stepIndex = CATS.length - 1; render(true); break;

    case 'generate': {
      const issues = validateOrder();
      if (issues.length){
        toast(issues[0]);
        const n = document.getElementById('notice');
        if (n){ n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); }
        return;
      }
      view = 'final'; render(true);
      break;
    }

    case 'modify':  view = 'check'; render(true); break;
    case 'restart': resetAll(); view = 'cover'; render(true); break;
    case 'copy':    copyMenu(); break;
    case 'print':   window.print(); break;
  }
}

app.addEventListener('click', function (e){
  /* 汽水规格 */
  const sodaInc = e.target.closest('[data-soda-inc]');
  if (sodaInc){
    e.preventDefault();
    const [brand, size] = sodaInc.dataset.sodaInc.split('|');
    changeSpecQty(state.sodaItems, brand, size, 1);
    return;
  }
  const sodaDec = e.target.closest('[data-soda-dec]');
  if (sodaDec){
    e.preventDefault();
    const [brand, size] = sodaDec.dataset.sodaDec.split('|');
    changeSpecQty(state.sodaItems, brand, size, -1);
    return;
  }

  /* 果汁规格 */
  const juiceInc = e.target.closest('[data-juice-inc]');
  if (juiceInc){
    e.preventDefault();
    const [name, size] = juiceInc.dataset.juiceInc.split('|');
    changeSpecQty(state.juiceItems, name, size, 1);
    return;
  }
  const juiceDec = e.target.closest('[data-juice-dec]');
  if (juiceDec){
    e.preventDefault();
    const [name, size] = juiceDec.dataset.juiceDec.split('|');
    changeSpecQty(state.juiceItems, name, size, -1);
    return;
  }

  /* 普通菜品 / 锅底份数 */
  const qtyBtn = e.target.closest('[data-qty]');
  if (qtyBtn){
    e.preventDefault();
    changeQty(qtyBtn.dataset.name, qtyBtn.dataset.qty === 'inc' ? 1 : -1);
    return;
  }

  /* 鸳鸯锅配置 */
  const potClear = e.target.closest('[data-pot-clear]');
  if (potClear){
    e.preventDefault();
    const name = potClear.dataset.potClear;
    const idx = Number(potClear.dataset.potIdx);
    const arr = state.potConfigs[name];
    if (arr && arr[idx]) arr[idx].clear = potClear.dataset.val;
    render(false);
    return;
  }
  const potSpicy = e.target.closest('[data-pot-spicy]');
  if (potSpicy){
    e.preventDefault();
    const name = potSpicy.dataset.potSpicy;
    const idx = Number(potSpicy.dataset.potIdx);
    const arr = state.potConfigs[name];
    if (arr && arr[idx]) arr[idx].spicy = potSpicy.dataset.val;
    render(false);
    return;
  }

  /* 主选项 */
  const optEl = e.target.closest('[data-opt]');
  if (optEl){
    pickOption(Number(optEl.dataset.opt));
    return;
  }

  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.dataset.type){ pickType(btn.dataset.type); return; }
  if (btn.dataset.nav){ handleNav(btn.dataset.nav); return; }
  if (btn.dataset.act){ handleAct(btn.dataset.act); return; }
});

app.addEventListener('keydown', function (e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('[data-opt]');
  if (!card) return;
  e.preventDefault();
  card.click();
});

/* =====================================================================
   8. 复制菜单
   ===================================================================== */
function menuText(){
  const b = DATA[state.type];
  const rows = menuSections();
  const line = '────────────────────';
  let t = '我的火锅菜单\n';
  t += b.name + ' · ' + b.tagline + '\n';
  t += line + '\n';
  rows.forEach(r => {
    t += r.zh + (r.en ? ' ' + r.en : '') + '：'
       + (r.items.length ? r.items.join('、') : '未选择') + '\n';
  });
  t += line + '\n祝你们用餐愉快！';
  return t;
}

function copyMenu(){
  const text = menuText();

  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err){ ok = false; }
    document.body.removeChild(ta);
    toast(ok ? '菜单已复制到剪贴板' : '复制失败，请手动选择文字复制');
  }

  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(() => toast('菜单已复制到剪贴板'))
      .catch(fallback);
  } else {
    fallback();
  }
}

let toastEl = null, toastTimer = null;
function toast(msg){
  if (!toastEl){
    toastEl = document.createElement('div');
    toastEl.className = 'toast';
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  void toastEl.offsetWidth;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

  /* 8 小节 × 8 个八分音符，0 = 休止 */
  melody: [
    659.25, 0, 783.99, 0, 659.25, 523.25, 587.33, 0,
    587.33, 0, 493.88, 0, 392.00, 440.00, 493.88, 0,
    523.25, 0, 659.25, 0, 880.00, 783.99, 659.25, 0,
    698.46, 0, 659.25, 0, 523.25, 587.33, 659.25, 0,
    783.99, 0, 659.25, 0, 523.25, 0, 587.33, 0,
    659.25, 0, 587.33, 0, 493.88, 0, 392.00, 0,
    880.00, 0, 783.99, 0, 659.25, 0, 523.25, 0,
    587.33, 0, 659.25, 0, 698.46, 0, 783.99, 0
  ],

  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();

    this.master = this.ctx.createGain();
    this.master.gain.value = 0;

    this.filter = this.ctx.createBiquadFilter();
    this.filter.type = 'lowpass';
    this.filter.frequency.value = 3200;
    this.filter.Q.value = 0.4;

    this.delay = this.ctx.createDelay(1.0);
    this.delay.delayTime.value = 0.26;
    const fb = this.ctx.createGain(); fb.gain.value = 0.20;
    const wet = this.ctx.createGain(); wet.gain.value = 0.16;

    this.master.connect(this.filter);
    this.filter.connect(this.ctx.destination);
    this.filter.connect(this.delay);
    this.delay.connect(fb);
    fb.connect(this.delay);
    this.delay.connect(wet);
    wet.connect(this.ctx.destination);
  },

  /* 小提琴：双锯齿 + 颤音 + 低通 */
  violin(freq, time, dur, vol){
    if (!this.ctx) return;
    const o1 = this.ctx.createOscillator();
    const o2 = this.ctx.createOscillator();
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    const filt = this.ctx.createBiquadFilter();
    const g = this.ctx.createGain();

    o1.type = 'sawtooth';
    o2.type = 'sawtooth';
    o1.frequency.value = freq;
    o2.frequency.value = freq * 1.004;

    lfo.type = 'sine';
    lfo.frequency.value = 5.4;
    lfoGain.gain.value = freq * 0.0055;
    lfo.connect(lfoGain);
    lfoGain.connect(o1.frequency);
    lfoGain.connect(o2.frequency);

    filt.type = 'lowpass';
    filt.frequency.value = 2400;
    filt.Q.value = 1.1;

    const atk = 0.08;
    const rel = Math.min(0.3, dur * 0.5);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(vol, time + atk);
    g.gain.linearRampToValueAtTime(vol * 0.85, time + dur - rel);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);

    o1.connect(filt);
    o2.connect(filt);
    filt.connect(g);
    g.connect(this.master);

    o1.start(time); o2.start(time); lfo.start(time);
    o1.stop(time + dur + 0.06);
    o2.stop(time + dur + 0.06);
    lfo.stop(time + dur + 0.06);
  },

  /* 拨弦伴奏 */
  pluck(freq, time, vol){
    if (!this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(vol, time + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.30);
    o.connect(g);
    g.connect(this.master);
    o.start(time);
    o.stop(time + 0.33);
  },

  /* 低音 */
  bass(freq, time, dur, vol){
    if (!this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(vol, time + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g);
    g.connect(this.master);
    o.start(time);
    o.stop(time + dur + 0.05);
  },

  schedule(){
    if (!this.playing || !this.ctx) return;
    const beat = 60 / this.bpm;
    const now = this.ctx.currentTime + 0.1;
    const barIdx = this.bar % 8;
    const prog = this.progression[barIdx];

    /* 低音：第一拍根音，第三拍五度 */
    this.bass(prog.root, now, beat * 1.8, 0.060);
    this.bass(prog.root * 1.5, now + beat * 2, beat * 1.8, 0.045);

    /* 拨弦伴奏：每半拍一个和弦音，上下行交替 */
    const pat = [0, 1, 2, 1, 0, 2, 1, 2];
    for (let i = 0; i < 8; i++){
      const f = prog.chord[pat[i]] * 2;
      this.pluck(f, now + i * beat * 0.5, 0.030);
    }

    /* 小提琴旋律 */
    const base = barIdx * 8;
    for (let i = 0; i < 8; i++){
      const f = this.melody[base + i];
      if (f) this.violin(f, now + i * beat * 0.5, beat * 1.4, 0.050);
    }

    this.bar = (this.bar + 1) % 8;
    this.timer = setTimeout(() => this.schedule(), beat * 4 * 1000);
  },

  start(){
    this.init();
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (this.playing) return;
    this.playing = true;
    this.bar = 0;
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.setValueAtTime(this.master.gain.value, this.ctx.currentTime);
    this.master.gain.linearRampToValueAtTime(0.13, this.ctx.currentTime + 1.8);
    this.schedule();
  },

  stop(){
    if (!this.ctx) return;
    this.playing = false;
    clearTimeout(this.timer);
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.setValueAtTime(this.master.gain.value, this.ctx.currentTime);
    this.master.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.6);
  },

  toggle(){
    if (this.playing) this.stop();
    else this.start();
  }
};

const musicBtn = document.getElementById('musicBtn');
function updateMusicBtn(){
  if (Music.playing){
    musicBtn.textContent = '🎵';
    musicBtn.classList.remove('off');
    musicBtn.title = '关闭背景音乐';
  } else {
    musicBtn.textContent = '🔇';
    musicBtn.classList.add('off');
    musicBtn.title = '开启背景音乐';
  }
}
musicBtn.addEventListener('click', function (){
  Music.toggle();
  updateMusicBtn();
});
updateMusicBtn();

function autoStartMusic(){
  Music.start();
  updateMusicBtn();
  window.removeEventListener('pointerdown', autoStartMusic);
  window.removeEventListener('keydown', autoStartMusic);
}
window.addEventListener('pointerdown', autoStartMusic, { once:true });
window.addEventListener('keydown', autoStartMusic, { once:true });

/* =====================================================================
   10. 启动
   ===================================================================== */
render(true);
</script>
</body>
</html>
